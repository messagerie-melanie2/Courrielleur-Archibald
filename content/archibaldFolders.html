<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="../skin/theme.css">
  <script src="archibaldFolders.js" defer></script>
</head>
<body>
  <h4>Selectionnez les dossiers à archiver:</h4>
  <div class="folder-list" id="folderList">
    <div class="folder-item">
      <input type="checkbox" id="masterCheckbox">
      <div style="padding-left: 0px; flex: 1; font-weight: bold;">Tout sélectionner / désélectionner</div>
    </div>
    <br/>
    <!-- Folder items will be dynamically inserted here -->
  </div>
  <div class="folder-buttons">
    <button id="ok">Valider</button>
    <button id="cancel">Annuler</button>
  </div>
</body>
</html>
