<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Archibald Popup</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: var(--arrowpanel-background, #f0f0f4);
      color: var(--arrowpanel-color, #000);
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .popup {
      padding: 20px 30px;
      border-radius: 8px;
      background-color: var(--arrowpanel-background, #fff);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="popup">Hello world</div>
</body>
</html>
