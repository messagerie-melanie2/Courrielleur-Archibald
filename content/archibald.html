<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Archibald</title>
  <link rel="stylesheet" type="text/css" href="../skin/theme.css">
</head>
<body>
    <div class="input-group">
      <label for="mailbox">Archiver la boîte :</label>
      <select id="mailbox" style="font-weight: bold; width: 100%; padding: 6px; font-size: 14px;">
        <option>DEROUIN Ludovic – SG/DNUM/UNI/DETN/GMCD/PIAP</option>
        <option>JEAN Dupont – SG/DNUM/UNI/DETN/GMCD/SECUR</option>
        <option>MARIE Claire – SG/DNUM/UNI/DETN/DSI/ARCHIV</option>
      </select>
    </div>

    <div class="input-group">
      <label for="days">Archiver les messages de plus de :</label><br/>
      <input type="number" id="days" value="90" min="0"> jours
    </div>

    <div class="input-group">
      <label for="until">Soit jusqu'au :</label><br/>
      <input type="date" id="until" value="2025-01-10">
    </div>

    <div class="buttons">
      <button id="ok">Archiver</button>
      <button id="cancel">Annuler</button>
    </div>

  <script>
    document.getElementById('yes').addEventListener('click', () => {
      const days = document.getElementById('days').value;
      const until = document.getElementById('until').value;
      console.log(`Archiver les messages de plus de ${days} jours (jusqu'au ${until})`);
    });

    document.getElementById('no').addEventListener('click', () => {
      window.close();
    });
  </script>
</body>
</html>
